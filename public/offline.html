<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3E2532">
<title>Sei offline · Taglendo</title>
<!-- Pagina statica servita senza rete: i colori sono quelli di tokens/tokens.css. -->
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: #FFF7F0; color: #3E2532; font-family: Manrope, Arial, sans-serif; line-height: 1.5; }
  main { max-width: 420px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #3E2532; color: #FFF7F0; font-size: 26px; font-weight: 700; }
  h1 { margin: 0; font-size: 24px; letter-spacing: -.03em; }
  p { margin: 0; color: #725C66; }
  button { min-height: 48px; padding: 0 24px; margin-top: 8px; border: 0; border-radius: 12px; background: #3E2532; color: #FFF7F0; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  button:focus-visible { outline: 3px solid #3E2532; outline-offset: 4px; }
</style>
</head>
<body>
<main>
  <span class="icon" aria-hidden="true">↯</span>
  <h1>Sei offline</h1>
  <p>Questa pagina non è disponibile senza connessione. L’agenda che hai guardato per ultima resta aperta dalla sezione Agenda.</p>
  <button type="button" onclick="location.reload()">Riprova</button>
</main>
</body>
</html>
